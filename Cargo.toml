[workspace]
members = ["crates/llama-sys"]

[package]
name = "rummage"
version = "0.1.0"
edition = "2024"
description = "Instant multimodal semantic file search for the Unix terminal"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
blake3 = { version = "1.8.7", default-features = false, features = ["std"] }
clap = { version = "4.6.7", features = ["derive"] }
grep-matcher = "0.1.9"
grep-regex = "0.1.14"
grep-searcher = "0.1.17"
half = "2.7.1"
html2text = "=0.17.1"
ignore = "0.4.33"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "tiff", "gif", "bmp"] }
notify = { version = "8.2.0", default-features = false, features = ["macos_fsevent"] }
quick-xml = "0.42.0"
ratatui = { version = "0.30.2", features = ["unstable-rendered-line-info"] }
ratatui-image = { version = "11.1.0", default-features = false, features = ["crossterm"] }
regex = "1.13.1"
rummage-llama-sys = { path = "crates/llama-sys" }
rusqlite = { version = "0.40.2", features = ["bundled"] }
scraper = { version = "0.27.0", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
syntect = { version = "5.3.0", default-features = false, features = ["default-fancy"] }
xattr = "1.6.1"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

# GPU: Metal on macOS always; elsewhere `--features cuda` (NVIDIA) or `--features vulkan` (AMD, Intel, NVIDIA); neither = CPU.
[features]
cuda = ["rummage-llama-sys/cuda"]
vulkan = ["rummage-llama-sys/vulkan"]

[profile.release]
debug = "line-tables-only"
