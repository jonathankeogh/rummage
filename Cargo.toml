[workspace]
members = ["crates/llama-sys"]

[package]
name = "rummage"
version = "0.1.0"
edition = "2024"
description = "Instant multimodal semantic file search for the Unix terminal"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
ignore = "0.4.33"
ratatui = { version = "0.30.2", features = ["unstable-rendered-line-info"] }
rummage-llama-sys = { path = "crates/llama-sys" }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
syntect = { version = "5.3.0", default-features = false, features = ["default-fancy"] }

# GPU: Metal on macOS always; elsewhere `--features cuda` (NVIDIA) or `--features vulkan` (AMD, Intel, NVIDIA); neither = CPU.
[features]
cuda = ["rummage-llama-sys/cuda"]
vulkan = ["rummage-llama-sys/vulkan"]

[profile.release]
debug = "line-tables-only"
