name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu
            os: ubuntu-latest
          - name: ubuntu-arm64
            os: ubuntu-24.04-arm
          - name: macos
            os: macos-latest
          # Fedora's packages and compilers, in a container on an Ubuntu machine.
          - name: fedora
            os: ubuntu-latest
            container: fedora:42
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    steps:
      - name: System packages (Ubuntu)
        if: startsWith(matrix.name, 'ubuntu')
        run: sudo apt-get update && sudo apt-get install -y cmake clang libclang-dev poppler-utils tesseract-ocr ffmpeg
      - name: System packages (macOS)
        if: matrix.name == 'macos'
        run: brew install cmake poppler tesseract ffmpeg
      # ffmpeg from RPM Fusion, as Fedora users get it (Fedora's own ffmpeg-free can't encode H.264 for the tests).
      # Git comes first so the checkout brings the llama.cpp submodule.
      - name: System packages (Fedora)
        if: matrix.name == 'fedora'
        run: |
          dnf install -y git tar gzip zstd cmake gcc-c++ clang clang-devel poppler-utils tesseract curl
          dnf install -y https://mirrors.rpmfusion.org/free/fedora/rpmfusion-free-release-42.noarch.rpm
          dnf install -y --allowerasing ffmpeg
          git config --global --add safe.directory '*'
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}
      # The model (865 MB, public on Hugging Face), kept in GitHub's cache between runs so the tests that need it run
      # here too: downloaded once, restored after (dropped by GitHub after 7 days unused, then downloaded again).
      - uses: astral-sh/setup-uv@v6
      - name: Model files
        id: model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub/models--ggml-org--embeddinggemma-2-GGUF
          key: embeddinggemma-2-bfcd298762cc34d0357ece5ebdd31791a3a374d8
      - name: Download the model
        if: steps.model.outputs.cache-hit != 'true'
        run: >
          uvx --from huggingface_hub hf download ggml-org/embeddinggemma-2-GGUF
          embeddinggemma-2-Q8_0.gguf mmproj-embeddinggemma-2-Q8_0.gguf
          --revision bfcd298762cc34d0357ece5ebdd31791a3a374d8
      - name: Build
        run: cargo build --release --all-targets
      - name: Test
        run: cargo test --release -- --nocapture
