name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: System packages (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake clang libclang-dev poppler-utils tesseract-ocr ffmpeg
      - name: System packages (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake poppler tesseract ffmpeg
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The model (865 MB, public on Hugging Face), kept in GitHub's cache between runs so the tests that need it run
      # here too: downloaded once, restored after (dropped by GitHub after 7 days unused, then downloaded again).
      - uses: astral-sh/setup-uv@v6
      - name: Model files
        id: model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub/models--ggml-org--embeddinggemma-2-GGUF
          key: embeddinggemma-2-bfcd298762cc34d0357ece5ebdd31791a3a374d8
      - name: Download the model
        if: steps.model.outputs.cache-hit != 'true'
        run: >
          uvx --from huggingface_hub hf download ggml-org/embeddinggemma-2-GGUF
          embeddinggemma-2-Q8_0.gguf mmproj-embeddinggemma-2-Q8_0.gguf
          --revision bfcd298762cc34d0357ece5ebdd31791a3a374d8
      - name: Build
        run: cargo build --release --all-targets
      - name: Test
        run: cargo test --release -- --nocapture
