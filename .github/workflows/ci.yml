name: ci

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch cancels the run still going for an older one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu
            os: ubuntu-latest
          - name: ubuntu-arm64
            os: ubuntu-24.04-arm
          - name: macos
            os: macos-latest
          # Fedora's packages and compilers, in a container on an Ubuntu machine.
          - name: fedora
            os: ubuntu-latest
            container: fedora:42
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    steps:
      - name: System packages (Ubuntu)
        if: startsWith(matrix.name, 'ubuntu')
        run: sudo apt-get update && sudo apt-get install -y cmake clang libclang-dev poppler-utils tesseract-ocr ffmpeg tmux
      - name: System packages (macOS)
        if: matrix.name == 'macos'
        run: brew install cmake poppler tesseract ffmpeg tmux
      # ffmpeg from RPM Fusion, as Fedora users get it (Fedora's own ffmpeg-free can't encode H.264 for the tests).
      # Git comes first so the checkout brings the llama.cpp submodule.
      - name: System packages (Fedora)
        if: matrix.name == 'fedora'
        # Each try again a few times: package mirrors come and go.
        run: |
          retry() { for i in 1 2 3; do "$@" && return; sleep 10; done; return 1; }
          retry dnf install -y --allowerasing git tar gzip zstd cmake gcc-c++ clang clang-devel poppler-utils tesseract tmux
          retry dnf install -y https://download1.rpmfusion.org/free/fedora/rpmfusion-free-release-42.noarch.rpm
          retry dnf install -y --allowerasing ffmpeg
          git config --global --add safe.directory '*'
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}
      # The model (865 MB, public on Hugging Face), kept in GitHub's cache between runs so the tests that need it run
      # here too: downloaded once, restored after (dropped by GitHub after 7 days unused, then downloaded again). Plain
      # files in rummage's own model folder: Hugging Face's cache is links into a blob store, and a cache of it once
      # kept the links without the files (1.5 KB), so the model tests skipped for days without anyone noticing. One
      # cache per machine: GitHub stores paths relative to the checkout, and the Fedora container's home is elsewhere,
      # so a copy saved there unpacked out of sight on the others.
      - uses: astral-sh/setup-uv@v6
      - name: Model files
        uses: actions/cache@v4
        with:
          path: ~/.local/share/rummage/models
          key: rummage-models-${{ matrix.name }}-bfcd298762cc34d0357ece5ebdd31791a3a374d8
      - name: Download the model (unless it's there)
        run: |
          dir="$HOME/.local/share/rummage/models/bfcd298762cc34d0357ece5ebdd31791a3a374d8"
          mkdir -p "$dir"
          for file in embeddinggemma-2-Q8_0.gguf mmproj-embeddinggemma-2-Q8_0.gguf; do
            [ -s "$dir/$file" ] && continue
            curl -fL --retry 3 -o "$dir/$file" \
              "https://huggingface.co/ggml-org/embeddinggemma-2-GGUF/resolve/bfcd298762cc34d0357ece5ebdd31791a3a374d8/$file"
          done
      - name: Check the model files
        run: |
          ls -l "$HOME/.local/share/rummage/models/bfcd298762cc34d0357ece5ebdd31791a3a374d8"
          test "$(find "$HOME/.local/share/rummage/models" -name '*.gguf' -size +100M | wc -l)" -eq 2
      - name: Build
        run: cargo build --release --all-targets
      - name: Test
        env:
          RUMMAGE_REQUIRE_MODEL: "1"
        run: cargo test --release -- --nocapture
      # The files that once made indexing slow, stuck or wrong, each checked against the release build; quick mode
      # keeps the long recordings short on a CPU.
      # GitHub's Macs are virtual machines whose GPU is emulated: the model runs there many times slower than on the CPU
      # (the long media case didn't finish in 15 minutes). The tests above keep the GPU path; what follows runs on the
      # CPU there (RUMMAGE_CPU, carried into the installed service too).
      - name: Edge cases
        env:
          EDGE_QUICK: "1"
          RUMMAGE_CPU: ${{ matrix.name == 'macos' && '1' || '' }}
        run: uv run scripts/edge_cases.py
      # The service installed as a login item, as people run it: launchd on macOS, a systemd user service on Ubuntu
      # (whose user manager needs lingering on a machine nobody logs in to). Fedora runs in a container, without
      # systemd: there the service runs as `rummage watch` in the foreground (watching and keeping up are the same).
      - name: Background service (systemd user manager)
        if: startsWith(matrix.name, 'ubuntu')
        run: |
          sudo loginctl enable-linger "$USER"
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          for i in $(seq 1 30); do [ -S "/run/user/$(id -u)/bus" ] && break; sleep 1; done
      - name: Background service
        env:
          RUMMAGE_CPU: ${{ matrix.name == 'macos' && '1' || '' }}
        run: uv run scripts/service_check.py ${{ matrix.container && '--foreground' || '' }}
      # The interface in a terminal and inside tmux: draws at once, finds as you type, opens on ⏎ (and says so when
      # it can't: the Linux machines here have no xdg-open), gives the terminal back on esc; and the first run's setup.
      - name: Interface
        env:
          RUMMAGE_CPU: ${{ matrix.name == 'macos' && '1' || '' }}
        run: uv run scripts/interface_check.py
